services:
  - type: web
    name: placidus-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VECTORSTORE_PATH
        value: data/vectorstore
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true
